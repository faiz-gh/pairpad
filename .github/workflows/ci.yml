name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Matches the database the integration tests create and delete rooms in.
  TEST_DATABASE_URL: postgres://pairpad:pairpad@localhost:5432/pairpad?sslmode=disable

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pairpad
          POSTGRES_PASSWORD: pairpad
          POSTGRES_DB: pairpad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pairpad -d pairpad"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - name: Test (unit + Postgres integration)
        run: go test -race ./...
      - run: go build -o /dev/null ./cmd/server

  web:
    name: Web (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Bundle budget (initial JS < 200 KB gzipped)
        run: pnpm check:bundle

  compactor:
    name: Compactor (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compactor
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pairpad
          POSTGRES_PASSWORD: pairpad
          POSTGRES_DB: pairpad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pairpad -d pairpad"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: compactor/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: compactor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The Go server owns the schema; apply its migrations for the DB tests.
      - name: Apply schema migrations
        run: |
          for f in ../server/migrations/*.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Test (unit + Postgres integration)
        run: pnpm test

  images:
    name: Image (${{ matrix.image }})
    needs: [server, web, compactor]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Production (Dokploy): Go server + built web app in one image.
          - image: app
            context: .
            file: deploy/dokploy/app.Dockerfile
          - image: compactor
            context: compactor
            file: compactor/Dockerfile
          # Local all-in-one stack (deploy/docker-compose.yml with Caddy).
          - image: server
            context: server
            file: server/Dockerfile
          - image: web
            context: web
            file: web/Dockerfile
    env:
      # Pull requests only prove the images build; pushes to master publish.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v7
      # Every Dockerfile compiles on the build platform and has no RUN steps
      # in its final stage, so QEMU is only a safety net for base images.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/pairpad-${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # Oracle Cloud Ampere is arm64; amd64 for everything else.
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
