# Pairpad on Dokploy: the app (Go server + web UI) and the compactor.
#
# Postgres is a separate Dokploy database service so app deploys never touch
# it; set DATABASE_URL to its Internal Connection URL. Traefik (managed by
# Dokploy) routes HTTP to the app for every hostname in the router rule. See
# deploy/README.md for the full setup.
#
# Set every ${VAR} below in the Dokploy app's Environment tab.

services:
  app:
    build:
      context: ..
      dockerfile: deploy/app.Dockerfile
    image: pairpad-app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the Postgres service's Internal Connection URL}
      PORT: "8080"
      STATIC_DIR: /srv/web
      ROOM_TTL: ${ROOM_TTL:-720h}
      EXPIRY_INTERVAL: ${EXPIRY_INTERVAL:-1h}
      MAX_PEERS: ${MAX_PEERS:-25}
      MAX_HISTORY_BYTES: ${MAX_HISTORY_BYTES:-8388608}
      ROOM_CREATE_BURST: ${ROOM_CREATE_BURST:-10}
      ROOM_CREATE_PER_HOUR: ${ROOM_CREATE_PER_HOUR:-60}
      HISTORY_REFRESH_MIN: ${HISTORY_REFRESH_MIN:-1000}
      FLUSH_INTERVAL: ${FLUSH_INTERVAL:-500ms}
      FLUSH_MAX_BATCH: ${FLUSH_MAX_BATCH:-50}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Traefik reaches the app over dokploy-network (a private range), which
      # the server trusts for X-Forwarded-For by default. Tailnet clients
      # (100.64.0.0/10) are deliberately *not* trusted proxies, so each
      # device is rate-limited by its own tailnet IP.
    networks:
      - dokploy-network
    # Room hubs live in memory: run exactly one app container.
    # Longer than SHUTDOWN_TIMEOUT so pending edits are flushed on redeploy.
    stop_grace_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # Plain HTTP on the public IP and on both MagicDNS names. Traffic over
      # the tailnet is encrypted by WireGuard; public-IP traffic is not.
      - traefik.http.routers.pairpad.rule=Host(`${PUBLIC_IP:?set PUBLIC_IP}`) || Host(`${TAILNET_NAME:?set TAILNET_NAME}`) || Host(`${TAILNET_FQDN:?set TAILNET_FQDN}`)
      - traefik.http.routers.pairpad.entrypoints=web
      - traefik.http.routers.pairpad.service=pairpad
      - traefik.http.services.pairpad.loadbalancer.server.port=8080
      # Once you have a domain, uncomment for HTTPS via Dokploy's Let's
      # Encrypt resolver (and point the domain's A record at PUBLIC_IP):
      # - traefik.http.routers.pairpad-tls.rule=Host(`${DOMAIN}`)
      # - traefik.http.routers.pairpad-tls.entrypoints=websecure
      # - traefik.http.routers.pairpad-tls.tls.certresolver=letsencrypt
      # - traefik.http.routers.pairpad-tls.service=pairpad

  compactor:
    build:
      context: ../compactor
    image: pairpad-compactor
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the Postgres service's Internal Connection URL}
      COMPACT_INTERVAL: ${COMPACT_INTERVAL:-30s}
      COMPACT_MIN_UPDATES: ${COMPACT_MIN_UPDATES:-500}
      COMPACT_ROOMS_PER_PASS: ${COMPACT_ROOMS_PER_PASS:-50}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - dokploy-network
    depends_on:
      - app # the app applies schema migrations; the compactor retries until they exist

networks:
  dokploy-network:
    external: true
